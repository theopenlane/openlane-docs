<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5c6a72"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="978" height="598" rx="14" fill="#ffffff" stroke="#dadde1"/>

  <!-- left column: inputs -->
  <rect x="50" y="120" width="180" height="58" rx="9" fill="#e8f1fa" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="140" y="147" text-anchor="middle" font-size="15" font-weight="600" fill="#255a8a">Standards</text>
  <text x="140" y="166" text-anchor="middle" font-size="11.5" fill="#5c6a72">SOC 2, ISO 27001, ...</text>

  <rect x="50" y="250" width="180" height="58" rx="9" fill="#faf1df" stroke="#d99a2b" stroke-width="1.5"/>
  <text x="140" y="277" text-anchor="middle" font-size="15" font-weight="600" fill="#8a6216">Policies</text>
  <text x="140" y="296" text-anchor="middle" font-size="11.5" fill="#5c6a72">what you intend to do</text>

  <rect x="50" y="380" width="180" height="66" rx="9" fill="#eef2f4" stroke="#09151D" stroke-width="1.5"/>
  <text x="140" y="407" text-anchor="middle" font-size="15" font-weight="600" fill="#09151D">Registry</text>
  <text x="140" y="427" text-anchor="middle" font-size="11.5" fill="#5c6a72">people, assets, vendors</text>

  <!-- center: controls hub + procedures + risks -->
  <rect x="400" y="230" width="190" height="72" rx="9" fill="#e2f5f1" stroke="#1b867d" stroke-width="2"/>
  <text x="495" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#14655e">Controls</text>
  <text x="495" y="282" text-anchor="middle" font-size="11.5" fill="#5c6a72">how requirements are met</text>

  <rect x="405" y="440" width="180" height="54" rx="9" fill="#f3ecfa" stroke="#8e5cc4" stroke-width="1.5"/>
  <text x="495" y="472" text-anchor="middle" font-size="15" font-weight="600" fill="#5e3a87">Procedures</text>

  <rect x="415" y="70" width="160" height="54" rx="9" fill="#fdecec" stroke="#c65656" stroke-width="1.5"/>
  <text x="495" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#8a2f2f">Risks</text>

  <!-- right column: proof and outcome -->
  <rect x="760" y="230" width="170" height="66" rx="9" fill="#e2f5f1" stroke="#1b867d" stroke-width="1.5"/>
  <text x="845" y="257" text-anchor="middle" font-size="15" font-weight="600" fill="#14655e">Evidence</text>
  <text x="845" y="277" text-anchor="middle" font-size="11.5" fill="#5c6a72">proof it operates</text>

  <rect x="770" y="420" width="150" height="54" rx="9" fill="#eef2f4" stroke="#5c6a72" stroke-width="1.5"/>
  <text x="845" y="452" text-anchor="middle" font-size="15" font-weight="600" fill="#3a464d">Tasks</text>

  <rect x="740" y="60" width="210" height="70" rx="9" fill="#e8f1fa" stroke="#3b82c4" stroke-width="2"/>
  <text x="845" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#255a8a">Program</text>
  <text x="845" y="110" text-anchor="middle" font-size="11.5" fill="#5c6a72">one audit period, bundled</text>

  <!-- edges -->
  <g stroke="#5c6a72" stroke-width="1.5" fill="none">
    <line x1="230" y1="160" x2="398" y2="242" marker-end="url(#arrow2)"/>
    <line x1="230" y1="278" x2="398" y2="268" marker-end="url(#arrow2)"/>
    <line x1="230" y1="404" x2="398" y2="292" marker-end="url(#arrow2)"/>
    <line x1="495" y1="438" x2="495" y2="304" marker-end="url(#arrow2)"/>
    <line x1="495" y1="228" x2="495" y2="126" marker-end="url(#arrow2)"/>
    <line x1="758" y1="263" x2="592" y2="263" marker-end="url(#arrow2)"/>
    <line x1="845" y1="418" x2="845" y2="298" marker-end="url(#arrow2)"/>
    <path d="M 590 240 C 660 200, 700 160, 742 116" marker-end="url(#arrow2)"/>
    <path d="M 575 84 C 640 74, 680 72, 738 82" marker-end="url(#arrow2)"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" font-style="italic" fill="#5c6a72">
    <text x="300" y="188" text-anchor="middle">seed</text>
    <text x="308" y="262" text-anchor="middle">put into practice as</text>
    <text x="300" y="366" text-anchor="middle">defines what is in scope</text>
    <text x="508" y="378" text-anchor="start">operationalize</text>
    <text x="508" y="180" text-anchor="start">mitigate</text>
    <text x="672" y="252" text-anchor="middle">proves</text>
    <text x="858" y="366" text-anchor="start">produce</text>
    <text x="692" y="172" text-anchor="middle" transform="rotate(-27 692 172)">bundled into</text>
    <text x="655" y="66" text-anchor="middle">tracked in</text>
  </g>
</svg>
