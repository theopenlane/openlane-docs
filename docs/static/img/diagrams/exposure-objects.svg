<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5c6a72"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="938" height="558" rx="14" fill="#ffffff" stroke="#dadde1"/>

  <!-- left column: where records come from -->
  <rect x="40" y="100" width="190" height="66" rx="9" fill="#e8f1fa" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="135" y="127" text-anchor="middle" font-size="15" font-weight="600" fill="#255a8a">Integrations</text>
  <text x="135" y="147" text-anchor="middle" font-size="11.5" fill="#5c6a72">AWS, GCP, Defender, ...</text>

  <rect x="40" y="250" width="190" height="66" rx="9" fill="#e2f5f1" stroke="#1b867d" stroke-width="1.5"/>
  <text x="135" y="277" text-anchor="middle" font-size="15" font-weight="600" fill="#14655e">Scans</text>
  <text x="135" y="297" text-anchor="middle" font-size="11.5" fill="#5c6a72">every execution recorded</text>

  <rect x="40" y="400" width="190" height="66" rx="9" fill="#eef2f4" stroke="#09151D" stroke-width="1.5"/>
  <text x="135" y="427" text-anchor="middle" font-size="15" font-weight="600" fill="#09151D">Registry scope</text>
  <text x="135" y="447" text-anchor="middle" font-size="11.5" fill="#5c6a72">assets and entities</text>

  <!-- center: what surfaces -->
  <rect x="370" y="100" width="200" height="66" rx="9" fill="#faf1df" stroke="#d99a2b" stroke-width="1.5"/>
  <text x="470" y="127" text-anchor="middle" font-size="15" font-weight="600" fill="#8a6216">Vulnerabilities</text>
  <text x="470" y="147" text-anchor="middle" font-size="11.5" fill="#5c6a72">known weaknesses, CVEs</text>

  <rect x="370" y="310" width="200" height="66" rx="9" fill="#fbeee3" stroke="#d97b2b" stroke-width="1.5"/>
  <text x="470" y="337" text-anchor="middle" font-size="15" font-weight="600" fill="#8a4e16">Findings</text>
  <text x="470" y="357" text-anchor="middle" font-size="11.5" fill="#5c6a72">observed issues, per resource</text>

  <rect x="600" y="440" width="200" height="66" rx="9" fill="#f3ecfa" stroke="#8e5cc4" stroke-width="1.5"/>
  <text x="700" y="467" text-anchor="middle" font-size="15" font-weight="600" fill="#5e3a87">Remediations</text>
  <text x="700" y="487" text-anchor="middle" font-size="11.5" fill="#5c6a72">the tracked, verified fix</text>

  <!-- right: the durable judgment -->
  <rect x="710" y="140" width="180" height="84" rx="9" fill="#fdecec" stroke="#c65656" stroke-width="2"/>
  <text x="800" y="172" text-anchor="middle" font-size="16" font-weight="600" fill="#8a2f2f">Risks</text>
  <text x="800" y="192" text-anchor="middle" font-size="11.5" fill="#5c6a72">score, treatment, owner</text>
  <text x="800" y="208" text-anchor="middle" font-size="11.5" fill="#5c6a72">in the risk register</text>

  <!-- edges -->
  <g stroke="#5c6a72" stroke-width="1.5" fill="none">
    <line x1="135" y1="398" x2="135" y2="318" marker-end="url(#arrow3)"/>
    <line x1="230" y1="126" x2="368" y2="128" marker-end="url(#arrow3)"/>
    <path d="M 230 150 C 300 190, 320 260, 368 320" marker-end="url(#arrow3)"/>
    <line x1="230" y1="266" x2="368" y2="152" marker-end="url(#arrow3)"/>
    <line x1="230" y1="300" x2="368" y2="330" marker-end="url(#arrow3)"/>
    <line x1="570" y1="140" x2="708" y2="168" marker-end="url(#arrow3)"/>
    <line x1="570" y1="346" x2="712" y2="222" marker-end="url(#arrow3)"/>
    <line x1="620" y1="438" x2="548" y2="380" marker-end="url(#arrow3)"/>
    <line x1="742" y1="438" x2="788" y2="228" marker-end="url(#arrow3)"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" font-style="italic" fill="#5c6a72">
    <text x="148" y="362" text-anchor="start">defines what gets scanned</text>
    <text x="296" y="116" text-anchor="middle">ingest and normalize</text>
    <text x="262" y="248" text-anchor="middle" transform="rotate(38 262 248)">ingest</text>
    <text x="300" y="200" text-anchor="middle" transform="rotate(-40 300 200)">surface</text>
    <text x="299" y="306" text-anchor="middle" transform="rotate(12 299 306)">surface</text>
    <text x="636" y="140" text-anchor="middle">roll up into</text>
    <text x="650" y="302" text-anchor="middle" transform="rotate(-30 650 302)">escalate when systemic</text>
    <text x="560" y="424" text-anchor="middle">resolve</text>
    <text x="782" y="340" text-anchor="start" transform="rotate(-78 782 340)">reduce residual exposure</text>
  </g>
</svg>
